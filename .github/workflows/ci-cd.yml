name: Backend CI/CD

on:
  push:
    branches: [production]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.9.0

      - name: Run ruff lint check
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  # ── Job 2: Tests ─────────────────────────────────────────────────────────
  test:
    name: Tests (Django + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint

    env:
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_gym
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      PUBLIC_DOMAIN: "localhost"
      DJANGO_SETTINGS_MODULE: config.settings
      SKIP_DB_BOOTSTRAP: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_gym
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev gcc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test --verbosity=2

  # ── Job 3: Deploy ─────────────────────────────────────────────────────────
  # Only runs on direct push to production (not on PRs)
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [lint, test]

    environment:
      name: production
      url: https://${{ secrets.PUBLIC_DOMAIN }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_BACKEND_PATH }}"
            chmod +x scripts/deploy-zero-downtime.sh
            ./scripts/deploy-zero-downtime.sh
