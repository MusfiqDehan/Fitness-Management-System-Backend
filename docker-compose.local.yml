services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-backend-local
    image: gym-backend-local:latest
    env_file: .env.local
    environment:
      - DEBUG=true
    ports:
      - "8021:8021"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app                         # bind-mount source for hot reload
      - backend_media_local:/app/media # persist uploaded media
    networks:
      - gym_local_network
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8021", "--workers", "2", "--reload", "--timeout", "120"]
    restart: unless-stopped

  db:
    image: postgres:17.9-alpine
    container_name: gym-db-local
    env_file: .env.local
    ports:
      - "5451:5432"    # expose to host for local DB tools (e.g. pgAdmin, DBeaver)
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gym_local_network
    restart: unless-stopped

volumes:
  postgres_data_local:
  backend_media_local:

networks:
  gym_local_network:
    name: gym_local_network
    driver: bridge
