services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-backend
    image: gym-backend:latest
    env_file: .env.prod
    expose:
      - "8021"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks:
      - app_network
      - traefik_proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8021/api/v1/schema/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # ── Backend router: all *.musfiqdehan.com subdomains,
      #    only for API / admin / media / static paths.
      #    HostRegexp uses a plain Go regex (Traefik v3 syntax).
      - "traefik.http.routers.backend.rule=HostRegexp(`^[a-z0-9][a-z0-9-]*\\.musfiqdehan\\.com$`) && (PathPrefix(`/api`) || PathPrefix(`/media`) || PathPrefix(`/static`) || PathPrefix(`/admin`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      # Stabilise wildcard TLS matching for HostRegexp routes (Traefik v3)
      - "traefik.http.routers.backend.tls.domains[0].main=musfiqdehan.com"
      - "traefik.http.routers.backend.tls.domains[0].sans=*.musfiqdehan.com"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.middlewares=security-headers@file,compress@file"

      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=8021"
    restart: unless-stopped

  db:
    image: postgres:17.9-alpine
    container_name: gym-db
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  app_network:
    name: gym_app_network
    driver: bridge
  traefik_proxy:
    external: true
    name: traefik_proxy
