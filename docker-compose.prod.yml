services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-backend
    image: gym-backend:latest
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SKIP_DB_BOOTSTRAP=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "8021"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks:
      - app_network
      - traefik_proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"Host: $${PUBLIC_DOMAIN:-fitssort.com}\" -H \"X-Forwarded-Proto: https\" http://127.0.0.1:8021/api/v1/health/tenant/ > /dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # ── Backend router: fitssort.com + all *.fitssort.com subdomains,
      #    only for API / admin / media / static / ADMS device paths.
      #    HostRegexp uses a plain Go regex (Traefik v3 syntax).
      - "traefik.http.routers.backend.rule=(Host(`fitssort.com`) || HostRegexp(`^[a-z0-9][a-z0-9-]*\\.fitssort\\.com$`)) && (PathPrefix(`/api`) || PathPrefix(`/media`) || PathPrefix(`/static`) || PathPrefix(`/admin`) || PathPrefix(`/ws`) || PathPrefix(`/iclock`) || PathPrefix(`/cdata`) || PathPrefix(`/getrequest`) || PathPrefix(`/devicecmd`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      # Stabilise wildcard TLS matching for HostRegexp routes (Traefik v3)
      - "traefik.http.routers.backend.tls.domains[0].main=fitssort.com"
      - "traefik.http.routers.backend.tls.domains[0].sans=*.fitssort.com"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.middlewares=security-headers@file,compress@file"

      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=8021"

      # ── Plain-HTTP ADMS router for legacy devices that do not support HTTPS.
      #    Restrict HTTP exposure to device endpoints only; all app/browser
      #    traffic remains on the existing HTTPS routers above.
      - "traefik.http.routers.backend-adms-http.rule=(Host(`fitssort.com`) || HostRegexp(`^[a-z0-9][a-z0-9-]*\\.fitssort\\.com$`)) && (PathPrefix(`/iclock`) || PathPrefix(`/cdata`) || PathPrefix(`/getrequest`) || PathPrefix(`/devicecmd`))"
      - "traefik.http.routers.backend-adms-http.entrypoints=web"
      - "traefik.http.routers.backend-adms-http.priority=200"
      - "traefik.http.routers.backend-adms-http.service=backend"

      # ── Standard HTTP router for browser/API traffic. Redirect to HTTPS while
      #    leaving the higher-priority ADMS HTTP router above untouched.
      - "traefik.http.routers.backend-http.rule=(Host(`fitssort.com`) || HostRegexp(`^[a-z0-9][a-z0-9-]*\\.fitssort\\.com$`)) && (PathPrefix(`/api`) || PathPrefix(`/media`) || PathPrefix(`/static`) || PathPrefix(`/admin`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.priority=10"
      - "traefik.http.routers.backend-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.backend-http.service=backend"

      # ── Backend router for tenant-owned CUSTOM domains (any host that is not
      #    fitssort.com / *.fitssort.com), API / admin / media / static / ADMS paths.
      #    On-demand Let's Encrypt cert per SNI via the customdomains resolver.
      - "traefik.http.routers.backend-custom.rule=HostRegexp(`^.+$`) && !Host(`fitssort.com`) && !HostRegexp(`^[a-z0-9][a-z0-9-]*\\.fitssort\\.com$`) && (PathPrefix(`/api`) || PathPrefix(`/media`) || PathPrefix(`/static`) || PathPrefix(`/admin`) || PathPrefix(`/ws`) || PathPrefix(`/iclock`) || PathPrefix(`/cdata`) || PathPrefix(`/getrequest`) || PathPrefix(`/devicecmd`))"
      - "traefik.http.routers.backend-custom.entrypoints=websecure"
      - "traefik.http.routers.backend-custom.tls=true"
      - "traefik.http.routers.backend-custom.tls.certresolver=customdomains"
      - "traefik.http.routers.backend-custom.priority=100"
      - "traefik.http.routers.backend-custom.middlewares=security-headers@file,compress@file"
      - "traefik.http.routers.backend-custom.service=backend"

      # ── Plain-HTTP ADMS router for tenant-owned CUSTOM domains. Needed for
      #    devices that only support domain + HTTP, not HTTPS.
      - "traefik.http.routers.backend-custom-adms-http.rule=HostRegexp(`^.+$`) && !Host(`fitssort.com`) && !HostRegexp(`^[a-z0-9][a-z0-9-]*\\.fitssort\\.com$`) && (PathPrefix(`/iclock`) || PathPrefix(`/cdata`) || PathPrefix(`/getrequest`) || PathPrefix(`/devicecmd`))"
      - "traefik.http.routers.backend-custom-adms-http.entrypoints=web"
      - "traefik.http.routers.backend-custom-adms-http.priority=200"
      - "traefik.http.routers.backend-custom-adms-http.service=backend"

      # ── Standard HTTP router for custom-domain browser/API traffic. Redirect
      #    to HTTPS while keeping ADMS HTTP on the dedicated router above.
      - "traefik.http.routers.backend-custom-http.rule=HostRegexp(`^.+$`) && !Host(`fitssort.com`) && !HostRegexp(`^[a-z0-9][a-z0-9-]*\\.fitssort\\.com$`) && (PathPrefix(`/api`) || PathPrefix(`/media`) || PathPrefix(`/static`) || PathPrefix(`/admin`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.backend-custom-http.entrypoints=web"
      - "traefik.http.routers.backend-custom-http.priority=10"
      - "traefik.http.routers.backend-custom-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.backend-custom-http.service=backend"
    command: ["daphne", "-b", "0.0.0.0", "-p", "8021", "config.asgi:application"]
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-celery-worker
    image: gym-backend:latest
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SKIP_DB_BOOTSTRAP=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "config.celery:app", "worker", "--loglevel=INFO", "--concurrency=4", "--prefetch-multiplier=1", "--max-tasks-per-child=500"]
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    networks:
      - app_network
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-celery-beat
    image: gym-backend:latest
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "config.celery:app", "beat", "--loglevel=INFO", "--pidfile=/tmp/celerybeat.pid"]
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    networks:
      - app_network
    restart: unless-stopped

  db:
    image: postgres:17.9-alpine
    container_name: gym-db
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gym-redis
    command: ["redis-server", "--save", "300", "1000", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  app_network:
    name: gym_app_network
    driver: bridge
  traefik_proxy:
    external: true
    name: traefik_proxy
