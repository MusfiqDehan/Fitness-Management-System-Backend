# Production PostgreSQL tuning for Contabo VPS 10 (8 GB RAM, SSD).
# Mounted by docker-compose.prod.yml — see db service command.

listen_addresses = '*'
max_connections = 80

# Memory (container limit ~2.5 GB)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# SSD planner hints
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL
wal_compression = on

# Logging (errors only in prod)
log_min_messages = warning
