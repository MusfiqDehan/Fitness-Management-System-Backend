; PgBouncer configuration for django-tenants (session pooling required).
; userlist.txt is generated at container start from POSTGRES_USER/PASSWORD.

[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
default_pool_size = 20
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
admin_users = postgres
