<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937;">
    <h2 style="margin-bottom: 8px;">Tenant Invitation</h2>
    <p>Hello,</p>
    <p>You have been invited to manage tenant <strong>{{ company_name }}</strong>.</p>
    <p>Subdomain: <strong>{{ subdomain }}</strong></p>
    <p>
      Accept the invitation and create your password:<br/>
      <a href="{{ invitation_url }}">{{ invitation_url }}</a>
    </p>
    <p>This invitation expires at {{ expires_at }}.</p>
  </body>
</html>
